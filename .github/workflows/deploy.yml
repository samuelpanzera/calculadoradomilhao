name: Deploy to Production

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies and build
        run: |
          if [ -f package.json ]; then
            bun install
            bun run build
          else
            echo "No package.json found. Creating a placeholder dist directory for validation..."
            mkdir -p dist
            echo "<h1>Calculadora do Milhão - Placeholder</h1>" > dist/index.html
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS & Validate Nginx with Rollback
        run: |
          # 1. Create remote temporary work directory
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /tmp/deploy-calculadoramilhao"
          
          # 2. Transfer configurations to remote work directory
          scp -o StrictHostKeyChecking=no infra/nginx/calculadoramilhao.conf ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}:/tmp/deploy-calculadoramilhao/calculadoramilhao.conf
          scp -o StrictHostKeyChecking=no infra/frontend/calculadoramilhao-frontend.container ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}:/tmp/deploy-calculadoramilhao/calculadoramilhao-frontend.container
          
          # 3. Connect via SSH to perform atomic updates and restart services
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            
            # Setup necessary directories
            sudo mkdir -p /etc/nginx/conf.d
            sudo mkdir -p /etc/containers/systemd
            
            # Define Nginx configuration files
            NGINX_CONF="/etc/nginx/conf.d/calculadoramilhao.conf"
            NGINX_BACKUP="/etc/nginx/conf.d/calculadoramilhao.conf.bak"
            
            # Backup the existing config if it exists
            if [ -f "$NGINX_CONF" ]; then
              echo "Backing up existing Nginx configuration..."
              sudo cp "$NGINX_CONF" "$NGINX_BACKUP"
            fi
            
            # Copy new configuration to the live path
            echo "Applying new Nginx configuration..."
            sudo cp /tmp/deploy-calculadoramilhao/calculadoramilhao.conf "$NGINX_CONF"
            
            # Test Nginx configuration for syntax errors
            echo "Testing Nginx configuration..."
            NGINX_TEST_OUT=$(sudo nginx -t 2>&1 || true)
            echo "$NGINX_TEST_OUT"
            
            if echo "$NGINX_TEST_OUT" | grep -q "syntax is ok" && echo "$NGINX_TEST_OUT" | grep -q "test is successful"; then
              echo "Nginx configuration is valid. Reloading Nginx..."
              # Delete the backup as new configuration is healthy
              if [ -f "$NGINX_BACKUP" ]; then
                sudo rm "$NGINX_BACKUP"
              fi
              sudo systemctl reload nginx
            else
              # If config test failed, check if it's due to missing SSL certificate
              if echo "$NGINX_TEST_OUT" | grep -q -E "cannot load certificate|No such file or directory"; then
                echo "SSL Certificate appears to be missing. Bootstrapping with HTTP-only configuration..."
                
                # Write a temporary HTTP-only configuration to tmp directory
                cat << 'EOF_HTTP' > /tmp/deploy-calculadoramilhao/http.conf
                server {
                    listen 80;
                    listen [::]:80;
                    server_name calculadoramilhao.com.br www.calculadoramilhao.com.br;
                
                    location /.well-known/acme-challenge/ {
                        alias /var/www/html/.well-known/acme-challenge/;
                    }
                
                    location / {
                        proxy_pass http://127.0.0.1:3200;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                    }
                }
                EOF_HTTP

                # Copy HTTP configuration to the live Nginx path
                sudo cp /tmp/deploy-calculadoramilhao/http.conf "$NGINX_CONF"
                
                echo "Testing temporary HTTP configuration..."
                if sudo nginx -t; then
                  echo "Temporary HTTP configuration is valid. Reloading Nginx..."
                  sudo systemctl reload nginx
                  
                  # Attempt to run acme.sh to issue the certificate automatically
                  echo "Attempting to issue SSL Certificate using acme.sh..."
                  if sudo -n /root/.acme.sh/acme.sh --issue -d calculadoramilhao.com.br -d www.calculadoramilhao.com.br -w /var/www/html --ecc; then
                    echo "SSL Certificate issued successfully! Re-applying full HTTPS Nginx configuration..."
                    sudo cp /tmp/deploy-calculadoramilhao/calculadoramilhao.conf "$NGINX_CONF"
                    if sudo nginx -t; then
                      sudo systemctl reload nginx
                      echo "Successfully upgraded to HTTPS!"
                      if [ -f "$NGINX_BACKUP" ]; then
                        sudo rm "$NGINX_BACKUP"
                      fi
                    else
                      echo "CRITICAL: Re-applying HTTPS config failed after successful certificate issue!"
                      if [ -f "$NGINX_BACKUP" ]; then
                        sudo mv "$NGINX_BACKUP" "$NGINX_CONF"
                      fi
                      sudo nginx -t && sudo systemctl reload nginx
                      exit 1
                    fi
                  else
                    echo "=========================================================================="
                    echo "WARNING: Could not automatically issue SSL certificate via acme.sh."
                    echo "This might be due to sudo permissions or DNS propagation delays."
                    echo "Nginx is running in HTTP-only mode so that the ACME challenge can be met."
                    echo "Please log into the VPS as root and run the following command manually:"
                    echo "  sudo /root/.acme.sh/acme.sh --issue -d calculadoramilhao.com.br -d www.calculadoramilhao.com.br -w /var/www/html --ecc"
                    echo "Once done, re-trigger this deployment to enable HTTPS."
                    echo "=========================================================================="
                  fi
                else
                  echo "CRITICAL: Temporary HTTP configuration failed! Restoring backup..."
                  if [ -f "$NGINX_BACKUP" ]; then
                    sudo mv "$NGINX_BACKUP" "$NGINX_CONF"
                  else
                    sudo rm "$NGINX_CONF"
                  fi
                  sudo nginx -t && sudo systemctl reload nginx
                  exit 1
                fi
              else
                echo "CRITICAL: Nginx configuration test failed for another reason! Restoring backup..."
                if [ -f "$NGINX_BACKUP" ]; then
                  sudo mv "$NGINX_BACKUP" "$NGINX_CONF"
                else
                  sudo rm "$NGINX_CONF"
                fi
                sudo nginx -t
                sudo rm -rf /tmp/deploy-calculadoramilhao
                echo "Deployment aborted due to Nginx validation failure."
                exit 1
              fi
            fi
            
            # 4. Deploy Quadlet container configuration
            echo "Applying Quadlet configuration..."
            sudo cp /tmp/deploy-calculadoramilhao/calculadoramilhao-frontend.container /etc/containers/systemd/calculadoramilhao-frontend.container
            
            # 5. Reload systemd daemon to pick up the updated Quadlet definition
            echo "Reloading systemd daemon..."
            sudo systemctl daemon-reload
            
            # 6. Restart/Start the systemd unit created by Quadlet
            echo "Restarting service: calculadoramilhao-frontend..."
            sudo systemctl restart calculadoramilhao-frontend
            
            # Cleanup temporary deployment directory
            sudo rm -rf /tmp/deploy-calculadoramilhao
            echo "Deployment finished successfully!"
          EOF
